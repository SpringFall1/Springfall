<script>

function land(b,top){py=top;vx=vy=0;mode='idle';sq=.4;sqv=0;wobv=9;landT=.6;expN='happy';expK='idle';expT=t+1.1;const i=bars.indexOf(b);if(b.type==='crumble'&&!b.cr)b.cr=.8;perfect(b,i);

 if(mp.rd){ov.style.display='none';mpPush();return}
 let db='';if(daily){const k='pogoDaily'+dseed();let b0=0;try{b0=+localStorage.getItem(k)||0}catch(e){}if(score>b0){b0=score;try{localStorage.setItem(k,b0)}catch(e){}}db='<br>Today\u2019s best '+b0}
 ov.innerHTML='<h1>Game over</h1><div>Score '+score+' · Best '+best+db+'<br>🏆 '+Object.keys(A).length+'/5<br>Tap to play again</div>'}
function jump(){sfx('jump',hold);mode='air';vx=90+hold*420;vy=-820;sq=1.45;sqv=0;wobv=-4}

 const b=bars[cur+14];rk={t:0,T:3.2,x0:px,y0:py,b};mode='rocket';sq=.7}

 else if(mode==='rocket'){rk.t+=dt;const u=Math.min(1,rk.t/rk.T),e=u*u*(3-2*u),b=rk.b,top=gy()-b.h;
  px=rk.x0+(b.x+b.w/2-rk.x0)*e;py=rk.y0+(top-rk.y0)*e-Math.sin(Math.PI*u)*Math.min(VH*.55,330);

  parts.push({x:px+(Math.random()-.5)*8,y:py,vx:-vx*.2+(Math.random()-.5)*40,vy:80+Math.random()*80,l:.5,c:Math.random()<.5?'#ff9a3c':'#ffd23c',r:4+Math.random()*4});
  if(u>=1){viaRocket=1;land(b,top);viaRocket=0;fuel=0}}
 else if(mode==='dead')deadT+=dt;
 shake=Math.max(0,shake-dt);tod+=(score/20-tod)*.02;for(const b of bars){if(b.type==='move')b.h=Math.max(40,b.h0+Math.sin(t*1.6+b.x*.01)*45);if(b.cr>0){b.cr-=dt;b.sh=(Math.random()-.5)*4;if(b.cr<=0){b.gone=1;b.sh=0;dust(b.x+b.w/2,gy()-b.h,16,'#ff6b6b');sfx('crumble');if(bars[cur]===b&&(mode==='idle'||mode==='charge')){mode='air';vx=0;vy=0}}}}if((mode==='idle'||mode==='charge')&&bars[cur].type==='move')py=gy()-bars[cur].h;pw.mg=Math.max(0,pw.mg-dt);pw.sl=Math.max(0,pw.sl-dt);for(const o of orbs){if(pw.mg>0&&!o.got&&mode!=='dead'){const dx=px-o.x,dy=(gy()-(py-70))-o.h;if(dx*dx+dy*dy<65000){o.x+=dx*Math.min(1,dt*5);o.h+=dy*Math.min(1,dt*5)}}if(!o.got&&mode!=='dead'&&Math.abs(o.x-px)<34&&Math.abs(gy()-o.h-(py-70))<40){o.got=1;score+=2;fuel=Math.min(100,fuel+8);pop.push({s:'+2',x:o.x,y:gy()-o.h-20,l:1,c:'#ffd166'});dust(o.x,gy()-o.h,10,'#ffd166');sfx('orb');orbN++;if(orbN>=10)ach('o10','10 orbs in one run');if(o.k)getPw(o.k)}}if(score>=50)ach('s50','Score 50!');if(score>=MS[mi]){pop.push({s:MS[mi]+'!',x:px,y:py-150,l:1.8,c:'#ffd166'});expN='wow';expT=t+2;sfx('mile');mi++}for(const p of pop)p.l-=dt*.9;pop=pop.filter(p=>p.l>0);updFx(dt);updFx2(dt);cam+=((SP?mp.sp.x:px)-VW*.3-cam)*Math.min(1,dt*6);if(SP)gen(mp.sp.x+VW+900);if(mp.cd>0)mp.cd-=dt;
 for(const p of parts){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt}parts=parts.filter(p=>p.l>0);
 sc.textContent=SP?mp.sp.s:score;{const ps=(pw.sh?'🛡️ ':'')+(pw.mg>0?'🧲'+Math.ceil(pw.mg)+' ':'')+(pw.sl>0?'⏱️'+Math.ceil(pw.sl):'');if(ps!==pwS){pwS=ps;pwEl.textContent=ps}}fb.style.width=fuel+'%';rb.classList.toggle('on',fuel>=100&&mode==='idle')}

function cycleSpec(){const a=mp.al||[];if(a.length<2)return;const i=a.findIndex(p=>p.peer===mp.spk);mp.spk=a[(i+1)%a.length].peer}
function mpPush(){if(!RM)return;mp.ls=performance.now();const r=mp.rd;RM.presence(r?{rd:r,seed:mp.seed,a:mode==='dead'?0:1,s:score,x:Math.round(px),g:Math.round(gy()-py),m:mode,q:+sq.toFixed(2),w:+wob.toFixed(2),h:+hold.toFixed(2),v:Math.round(vy),sk:skin,n:nmz(cfg.name)}:{rd:0,a:0,sk:skin,n:nmz(cfg.name)}).catch(()=>{})}
function startRound(seed,R){for(const k in RS)delete RS[k];mp.rd=R;mp.seed=seed;mp.ro={};mp.cd=3;mp.wait=0;mp.res=0;mp.sp=null;mp.spk='';mp.uk='';reset();t=0;expT=0;started=true;musicSet();ov.style.display='none';lb.style.display='none';mpPush()}
function mpStart(){const L=mpList();if(!mp.set||!L.length||!L[0].sameTab)return;let R=0;for(const p of L)R=Math.max(R,num(p.presence.rd,0)|0);startRound((Math.random()*2147483646|0)+1,R+1)}
function onP(){if(!RM)return;const L=mpList(),i=L.findIndex(p=>p.sameTab);
 if(mp.set){if(i>=4){mpLeave('Room is full (max 4 players).');return}
  const h=L[0];if(h){const hr=num(h.presence.rd,0)|0;if(mp.late<0)mp.late=hr;
   if(!h.sameTab&&hr>mp.rd&&hr>mp.late)startRound(Math.floor(num(h.presence.seed,1))||1,hr);
   mp.wait=!!(mp.late>0&&!mp.rd&&hr===mp.late)}}
 lbR()}
async function mpJoin(code,create){if(mp.busy||mp.on)return;mp.busy=1;lbMsg='Connecting\u2026';lbR();
 try{if(!window.Peer)throw 'lib';let rm=null;
  for(let k=0;k<6&&!rm;k++){try{rm=await Net.join(code,create)}catch(e){if(create&&e==='taken')code=newCode();else throw e}}
  if(!rm)throw 'net';RM=rm}
 catch(e){mp.busy=0;RM=null;lbMsg=e==='lib'?'Couldn\u2019t load the networking library (PeerJS). Check your internet connection.':e==='notfound'?'Room not found. Check the code.':'Couldn\u2019t reach the connection server ('+String(e).replace('net:','')+'). Open this file directly in a browser (not inside Claude), and check your connection.';lbR();return}
 const r=RM;mp.busy=0;mp.on=1;mp.code=code;mp.rd=0;mp.seed=0;mp.late=-1;mp.wait=0;mp.set=0;mp.ro={};lbMsg='';ov.style.display='none';
 r.onClose=()=>{if(RM===r)mpLeave('The host left the room.')};mp.un=[r.onPeers(onP)];r.presence({n:nmz(cfg.name),t0:Date.now(),sk:skin,rd:0,a:0,s:0}).catch(()=>{});
 setTimeout(()=>{if(RM===r){mp.set=1;onP()}},1500);lbR()}
function mpLeave(msg){for(const u of mp.un)try{u()}catch(e){}mp.un=[];if(RM)RM.leave().catch(()=>{});RM=null;Object.assign(mp,{on:0,rd:0,seed:0,cd:0,wait:0,res:0,sp:null,al:[],ro:{},late:-1,set:0,uk:''});lbMsg=msg||'';moE.innerHTML='';sbE.innerHTML='';started=false;musicSet();reset();ov.innerHTML='<h1>Spring Fall</h1><div class="by">by Tharun</div><div>Tap to play</div>';ov.style.display='flex';lbR()}
function lbR(){if(lb.style.display!=='flex')return;let h;
 if(!mp.on){h='<h2>Multiplayer</h2><div>Up to 4 players race the same level. When you fall, you spectate the others.<br>Set your name in \u2699\uFE0F first.</div><button class="pr" data-a="create">Create room</button><div>or join with a code</div><input id="lbi" maxlength="4" placeholder="CODE" autocomplete="off"><button data-a="join">Join</button><div class="lm">'+esc(lbMsg)+'</div><button data-a="close">Close</button>'}
 else{const L=mpList();h='<h2>Room</h2><b class="cd">'+esc(mp.code.toUpperCase())+'</b><div>Share this code \u00B7 Players '+Math.min(L.length,4)+'/4</div><ul>'+L.slice(0,4).map((p,i)=>'<li>'+esc(nmz(p.presence.n))+(i===0?' \u00B7 host':'')+(p.sameTab?' \u00B7 you':'')+'</li>').join('')+'</ul>'+
  (mp.wait?'<div>Round in progress \u2014 you\u2019ll join the next one.</div>':!mp.set?'<div>Connecting\u2026</div>':isHost()?'<button class="pr" data-a="start">Start game</button>':'<div>Waiting for the host to start\u2026</div>')+'<div><button data-a="leave">Leave room</button><button data-a="close">Close</button></div><div class="lm">'+esc(lbMsg)+'</div>'}
 if(h!==lbH){lbH=h;lcE.innerHTML=h}}
lb.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
 if(a==='close'){lb.style.display='none'}
 else if(a==='create'){mpJoin(newCode(),1)}
 else if(a==='join'){const c=($('lbi').value||'').toLowerCase().replace(/[^a-z0-9]/g,'');if(c.length<3){lbMsg='Enter the room code.';lbH='';lbR()}else mpJoin(c,0)}
 else if(a==='start')mpStart();else if(a==='leave')mpLeave()});
moE.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.a==='again')mpStart();else if(b.dataset.a==='leave')mpLeave()});
for(const el of[lb,moE]){el.addEventListener('pointerdown',e=>{if(el===lb||e.target.closest('button'))e.stopPropagation()});el.addEventListener('pointerup',e=>{if(el===lb||e.target.closest('button'))e.stopPropagation()})}
$('mpb').addEventListener('click',()=>{lb.style.display='flex';lbR()});
const RS={};let rsT=performance.now();
function drawRemote(d,full,key){const sv={px,py,sq,wob,mode,hold,vy,skin,nm:cfg.name,sn:cfg.showName,expN,expT,say,expK},nm=nmz(d.n);
 const now=performance.now(),dtR=Math.min(.1,Math.max(0,(now-(RS[key]&&RS[key].lt||now))/1000));
 const tx=num(d.x,0),tg=num(d.g,0),tv=num(d.v,0);
 let st=RS[key];if(!st){st=RS[key]={x:tx,g:tg,sq:num(d.q,1),w:num(d.w,0),h:num(d.h,0),v:tv,en:'idle',et:0,ek:'',sy:'Ready?',lt:now,seed:d.seed}}
 if(st.seed!==d.seed){st.seed=d.seed;st.x=tx;st.g=tg;st.et=0;st.ek=''}
 /* smooth toward the latest network position, with a little extrapolation from vertical speed */
 const k=1-Math.pow(.0001,dtR),ty=tg-tv*.04;
 if(Math.abs(tx-st.x)>500){st.x=tx;st.g=tg}else{st.x+=(tx-st.x)*k;st.g+=(ty-st.g)*k}
 st.sq+=(num(d.q,1)-st.sq)*k;st.w+=(num(d.w,0)-st.w)*k;st.h+=(num(d.h,0)-st.h)*k;st.v+=(tv-st.v)*k;st.lt=now;
 try{px=st.x;py=gy()-st.g;sq=st.sq;wob=st.w;mode=MM.includes(d.m)?d.m:'idle';hold=st.h;vy=st.v;skin=(num(d.sk,0)|0)&3;cfg.name=nm;cfg.showName=true;REM=1;
  /* this ghost's own expression state, so it doesn't fight with yours every frame */
  expN=st.en;expT=st.et;expK=st.ek;say=st.sy;
  ctx.save();ctx.globalAlpha=full?1:.5;chr();ctx.restore();
  st.en=expN;st.et=expT;st.ek=expK;st.sy=say;
  ctx.save();ctx.globalAlpha=full?1:.8;ctx.font='700 13px system-ui,sans-serif';ctx.textAlign='center';ctx.fillStyle='#e8f0ff';ctx.shadowColor='rgba(0,0,0,.7)';ctx.shadowBlur=6;ctx.fillText(nm,px-cam,py-170);ctx.restore()}
 finally{REM=0;({px,py,sq,wob,mode,hold,vy,skin,expN,expT,say,expK}=sv);cfg.name=sv.nm;cfg.showName=sv.sn}}
function mpGhosts(){if(!mp.on||!mp.al.length)return;const sp=isSpec();for(const p of mp.al){const d=p.presence,x=num(d.x,0);if(x-cam<-120||x-cam>VW+120)continue;drawRemote(d,sp&&p.peer===mp.spk,p.peer)}}
let uiT=0;
function mpTick(n){if(!mp.on||!RM)return;if(n-mp.ls>(mp.rd?33:1000))mpPush();
 const cr=mp.rd||(mp.wait?mp.late:0),L=mpList(),al=[],live=new Set();
 if(cr)for(const p of L){const d=p.presence;if((num(d.rd,0)|0)!==cr)continue;live.add(p.peer);
  if(mp.rd)mp.ro[p.peer]={n:nmz(d.n),s:num(d.s,0)|0,a:d.a?1:0,me:p.sameTab};
  if(d.a&&!p.sameTab)al.push(p)}
 if(mp.rd)for(const k in mp.ro)if(!live.has(k))mp.ro[k].a=0;
 let tp=al.find(p=>p.peer===mp.spk);if(!tp){tp=al[0]||null;mp.spk=tp?tp.peer:''}
 mp.al=al;mp.sp=tp?{x:num(tp.presence.x,0),s:num(tp.presence.s,0)|0,n:nmz(tp.presence.n)}:null;
 const R=Object.values(mp.ro);
 if(mp.rd&&!mp.res&&mp.cd<=0&&mode==='dead'&&R.length&&!R.some(r=>r.a))mp.res=1;
 if(n-uiT<200)return;uiT=n;
 const rs=R.slice().sort((a,b)=>b.s-a.s);
 sbE.innerHTML=rs.map(r=>'<div class="'+(r.a?'':'x ')+(r.me?'m':'')+'">'+esc(r.n)+' '+r.s+'</div>').join('');
 let h='';
 if(mp.rd&&mp.cd>0)h='<div class="cd">'+Math.ceil(mp.cd)+'</div><div class="cs">Get ready</div>';
 else if(mp.res){const top=rs[0],tie=rs.length>1&&rs[1].s===top.s;h='<div class="rs"><h3>'+(rs.length<2?'Round over':tie?'It\u2019s a tie!':esc(top.n)+' wins!')+'</h3><ol>'+rs.map((r,i)=>'<li><span>'+(i+1)+'. '+esc(r.n)+(r.me?' (you)':'')+'</span><b>'+r.s+'</b></li>').join('')+'</ol>'+(isHost()?'<button class="pr" data-a="again">Play again</button>':'<div>Waiting for the host\u2026</div>')+'<button data-a="leave">Leave</button></div>'}
 else if(isSpec())h='<div class="sp">\uD83D\uDC41 '+(mp.wait?'Round in progress \u2014 next round you play. ':'You\u2019re out. ')+'Spectating <b>'+esc(mp.sp.n)+'</b>'+(mp.al.length>1?'<br>Tap to switch player':'')+'</div>';
 else if(mp.wait)h='<div class="sp">Round in progress \u2014 you\u2019ll join the next one</div>';
 if(h!==mp.uk){mp.uk=h;moE.innerHTML=h}}
let last=performance.now();
(function loop(n){let dt=Math.min(.033,(n-last)/1000);last=n;if(slow>0){slow-=dt;dt*=.35}if(pw.sl>0)dt*=.6;if(!tut)update(dt);draw();mpTick(n);if(mode==='dead'&&deadT>.5&&!mp.on)ov.style.display='flex';requestAnimationFrame(loop)})(last);
</script></body></html>
